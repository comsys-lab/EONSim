workload_type: dlrm
num_format: 32  # FP32 assumed

# Embedding Layer Configuration
embedding_layer:
  embedding_dim: 128
  vectors_per_table: 500000
  num_tables: 60
  pooling_factor: 120

# Bottom MLP (256 -> 128 -> 128)
# Format: {m: Batch Size, n: Output Features, k: Input Features}
bot_mlp:
  - m: 1
    n: 128
    k: 256
  - m: 1
    n: 128
    k: 128

# Top MLP (128 -> 64 -> 1)
top_mlp:
  - m: 1
    n: 64
    k: 128
  - m: 1
    n: 1
    k: 64